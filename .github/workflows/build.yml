name: Build Legram (Full Repository Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Patch Core (Anti-Delete)
        run: |
          # حقن ميزة منع حذف الرسائل برمجياً
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true
          echo "✅ Anti-Delete patch applied."

      - name: 🔐 Prepare Provisioning & Build Configuration
        run: |
          # 1. إنشاء هيكل المجلدات
          mkdir -p build-input/data/provisioning
          
          # 2. فك تشفير الملفات
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # 3. نسخ ملفات التوقيع لكل الأهداف
          cd build-input/data/provisioning
          for name in Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload; do
            cp Telegram.mobileprovision $name.mobileprovision
          done
          
          # 4. إنشاء ملف BUILD الخاص بالتوقيع
          cat <<EOF > BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files(glob(["*.mobileprovision"]))
          EOF
          cd ../../../

      - name: 🏗 Inject Build Configuration Repository
        run: |
          # هذه هي الخطوة السحرية: تعريف المستودع الناقص في ملف WORKSPACE
          # سنخبر Bazel أن المجلد build-input/data هو مستودع رسمي
          
          # إنشاء ملف BUILD فارغ في المجلد الرئيسي لـ data ليعتبره Bazel حزمة (Package)
          touch build-input/data/BUILD
          
          # إضافة تعريف المستودع إلى نهاية ملف WORKSPACE
          echo "" >> WORKSPACE
          echo 'local_repository(' >> WORKSPACE
          echo '    name = "build_configuration",' >> WORKSPACE
          echo '    path = "build-input/data",' >> WORKSPACE
          echo ')' >> WORKSPACE
          
          echo "✅ build_configuration repository injected into WORKSPACE."

      - name: 🔑 Install Signing Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: ⚙️ Setup Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: 🚀 Build IPA
        run: |
          # سنزيل قيود .bazelrc التي وضعناها سابقاً لنسمح للنظام بالعمل بطبيعته
          rm -f .bazelrc
          
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Final-Package
          path: build/artifacts/*.ipa