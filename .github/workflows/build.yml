name: Legram Final Restoration (Bazel 6.4.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 🛠 Force Bazel 6.4.0
        run: |
          # سنستخدم Bazelisk لفرض النسخة التي أفهمها تماماً
          echo "6.4.0" > .bazelversion
          brew install bazelisk

      - name: 🧹 Clean Legacy Mess
        run: |
          # مسح أي إعدادات حاولنا بها إصلاح Bazel 8 لكي لا تسبب تضارب
          rm -f .bazelrc.user
          # الحفاظ على الـ .bazelrc الأصلي كما هو دون أي تعديل
          git checkout .bazelrc || true

      - name: 🏗 Prepare Stable Environment
        run: |
          mkdir -p build-input/data/provisioning
          
          # 1. ملف config.json الكامل (لأن سكريبت Python يطلبه بغض النظر عن نسخة Bazel)
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF

          # 2. ملف variables.bzl (المحرك الداخلي لـ Bazel 6)
          cat <<EOF > build-input/data/variables.bzl
          bundle_id = "com.CommitteeSupervision.gov"
          api_id = "${{ secrets.TELEGRAM_API_ID }}"
          api_hash = "${{ secrets.TELEGRAM_API_HASH }}"
          team_id = "9NS9KBTAFV"
          version = "11.5.1"
          build_number = "1"
          enable_siri = false
          enable_icloud = false
          EOF

          echo 'exports_files(["variables.bzl", "config.json"])' > build-input/data/BUILD
          
          # 3. إعداد ملفات التوقيع
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          cd build-input/data/provisioning
          for name in Telegram Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload ShareExtension NotificationServiceExtension; do
            cp Telegram.mobileprovision \$name.mobileprovision
          done
          echo 'package(default_visibility = ["//visibility:public"])' > BUILD
          echo 'exports_files(glob(["*.mobileprovision"]))' >> BUILD

      - name: 🔗 Stable Workspace Link
        run: |
          # في Bazel 6، الحقن في WORKSPACE بسيط ومباشر
          sed -i '' '1i\
          local_repository(name = "build_configuration", path = "build-input/data")\
          ' WORKSPACE

      - name: 🔑 Import Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: 🛠 Anti-Delete Patch
        run: |
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true

      - name: 🚀 Launch Build (The Reliable Way)
        run: |
          # هنا سيقوم Bazel 6.4.0 بالعمل في منطقته الآمنة
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Archive
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Stable-6.4.0
          path: build/artifacts/*.ipa