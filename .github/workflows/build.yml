name: Legram Final Build (Official Repair)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: ⚙️ Official Bazel 8 Compatibility (Append Mode)
        run: |
          # نستخدم >> للإضافة وليس > للمسح، لكي لا نفقد إعدادات تيليجرام الأصلية
          echo "common --enable_workspace" >> .bazelrc
          echo "common --noenable_bzlmod" >> .bazelrc
          echo "✅ Official Bazel 8 flags appended to existing config."

      - name: 🏗 Prepare Official Configuration
        run: |
          mkdir -p build-input/data/provisioning
          
          # 1. ملف config.json المكتمل (لحل KeyError رسمياً)
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF

          # 2. ملف variables.bzl المطلوب من نظام البناء
          cat <<EOF > build-input/data/variables.bzl
          bundle_id = "com.CommitteeSupervision.gov"
          api_id = "${{ secrets.TELEGRAM_API_ID }}"
          api_hash = "${{ secrets.TELEGRAM_API_HASH }}"
          team_id = "9NS9KBTAFV"
          version = "11.5.1"
          build_number = "1"
          enable_siri = false
          enable_icloud = false
          EOF

          # 3. ملف BUILD لمستودع البيانات
          echo 'package(default_visibility = ["//visibility:public"])' > build-input/data/BUILD
          echo 'exports_files(["variables.bzl", "config.json"])' >> build-input/data/BUILD

      - name: 🔐 Provisioning (Official Structure)
        run: |
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          cd build-input/data/provisioning
          # تكرار الملف لكل الأهداف المطلوبة برمجياً داخل مشروع تيليجرام
          for name in Telegram Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload ShareExtension NotificationServiceExtension; do
            cp Telegram.mobileprovision \$name.mobileprovision
          done
          echo 'package(default_visibility = ["//visibility:public"])' > BUILD
          echo 'exports_files(glob(["*.mobileprovision"]))' >> BUILD

      - name: 🔗 Link Repository (Official WORKSPACE)
        run: |
          # إضافة المستودع في نهاية الملف لضمان استقرار الـ Load statements
          echo "" >> WORKSPACE
          echo 'local_repository(name = "build_configuration", path = "build-input/data")' >> WORKSPACE

      - name: 🔑 Import Signing Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: 🛠 Patch Core (Anti-Delete)
        run: |
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true

      - name: 🚀 Start Official Build
        run: |
          # سكريبت تيليجرام سيستخدم الآن Bazel 8 مع الحفاظ على إعداداته الأصلية
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Official-Release
          path: build/artifacts/*.ipa