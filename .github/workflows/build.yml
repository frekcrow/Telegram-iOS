name: Build Legram (Official Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Automatic Patch (Anti-Delete)
        run: |
          echo "Searching for deletion logic..."
          # هذا السطر هو الذي نجحنا به سابقاً، سيبقى كما هو لضمان ميزتك
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true
          echo "✅ Anti-Delete feature injected."

      - name: 🔐 Prepare Signing & Provisioning (Fixed Targets)
        run: |
          # 1. إنشاء المجلد المطلوب
          mkdir -p build-input/data/provisioning
          
          # 2. فك تشفير الملفات الأساسية
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # 3. نسخ ملف التوقيع لكل الأسماء التي يبحث عنها Bazel (بالأسماء الدقيقة)
          PROV_DIR="build-input/data/provisioning"
          EXTENSIONS=("Share" "NotificationService" "NotificationContent" "Widget" "Intents" "SiriIntents" "BroadcastUpload" "NotificationServiceExtension" "ShareExtension")
          
          for ext in "${EXTENSIONS[@]}"; do
            cp "$PROV_DIR/Telegram.mobileprovision" "$PROV_DIR/$ext.mobileprovision"
          done

          # 4. إنشاء ملف BUILD صريح جداً (بدون استخدام glob لضمان التعرف)
          cat <<EOF > $PROV_DIR/BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files([
              "Telegram.mobileprovision",
              "Share.mobileprovision",
              "NotificationService.mobileprovision",
              "NotificationContent.mobileprovision",
              "Widget.mobileprovision",
              "Intents.mobileprovision",
              "SiriIntents.mobileprovision",
              "BroadcastUpload.mobileprovision",
              "NotificationServiceExtension.mobileprovision",
              "ShareExtension.mobileprovision",
          ])
          EOF

          # 5. تثبيت الشهادة في الماك
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: ⚙️ Setup Final Config JSON
        run: |
          # إضافة كافة الحقول المطلوبة لمنع خطأ KeyError
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf

      - name: 🔍 Debug Files Structure (Before Build)
        run: |
          echo "Current Path: $(pwd)"
          echo "Provisioning Files List:"
          ls -R build-input/data/provisioning/

      - name: 🚀 Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Final-Release
          path: build/artifacts/*.ipa