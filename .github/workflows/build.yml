name: Build Legram (Final Bazel 8 Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Force Bazel 8 Compatibility
        run: |
          # حقن إعدادات التوافق مباشرة في ملف الإعدادات الخاص بـ Bazel
          # هذا يغنينا عن تمرير الأوامر عبر سكريبت Make.py
          echo "common --noenable_bzlmod" >> .bazelrc
          echo "common --enable_workspace" >> .bazelrc
          echo "✅ Bazel forced into legacy compatibility mode."

      - name: 🛠 Patch Core (Anti-Delete)
        run: |
          # حقن ميزة منع حذف الرسائل برمجياً في كل مكان محتمل
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true
          echo "✅ Anti-Delete patch applied."

      - name: 🔐 Prepare Provisioning (Manual Names)
        run: |
          mkdir -p build-input/data/provisioning
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # استنساخ الملف بالأسماء التي صرخ النظام طلباً لها في السجلات السابقة
          cd build-input/data/provisioning
          for name in Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload; do
            cp Telegram.mobileprovision $name.mobileprovision
          done
          
          # إنشاء ملف BUILD الصريح جداً لتعريف الأهداف
          cat <<EOF > BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files([
              "Telegram.mobileprovision",
              "Share.mobileprovision",
              "NotificationService.mobileprovision",
              "NotificationContent.mobileprovision",
              "Widget.mobileprovision",
              "Intents.mobileprovision",
              "SiriIntents.mobileprovision",
              "BroadcastUpload.mobileprovision",
          ])
          EOF
          cd ../../../

      - name: 🔑 Install Signing Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: ⚙️ Full Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: 🚀 Build IPA
        run: |
          # تشغيل البناء بدون الأوامر التي رفضها السكريبت
          # الإعدادات الآن يتم سحبها تلقائياً من ملف .bazelrc
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-V8-Stable-Build
          path: build/artifacts/*.ipa