name: Build Legram (Official Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk openssl

      - name: 🛠 Inject Anti-Delete Feature
        run: |
          # تعديل الملف المسؤول عن مزامنة حذف الرسائل
          CORE_FILE="submodules/TelegramCore/Sources/StateManagement/ManagedSynchronizeGroupMessagesOperations.swift"
          if [ -f "$CORE_FILE" ]; then
            # استبدال وظيفة الحذف برسالة طباعة (لوق) لمنع التنفيذ الفعلي
            sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' "$CORE_FILE"
            echo "✅ Anti-Delete feature injected into TelegramCore."
          else
            echo "❌ Core file not found! Please check the path."
            exit 1
          fi

      - name: Prepare Signing Identity
        run: |
          mkdir -p build-input/data/provisioning
          
          # فك تشفير البيانات
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # الأسماء الحقيقية التي يبحث عنها Bazel (مستخرجة من Telegram/BUILD)
          EXTENSIONS=("Share" "NotificationService" "NotificationContent" "Widget" "Intents" "SiriIntents" "BroadcastUpload")
          for ext in "${EXTENSIONS[@]}"; do
            cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/$ext.mobileprovision
          done

          # إعداد الـ Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Create Definitive BUILD File
        run: |
          # هذا الملف هو ما يقرأه Bazel للتعرف على أهداف التوقيع
          cat <<EOF > build-input/data/provisioning/BUILD
          package(default_visibility = ["//visibility:public"])

          exports_files([
              "Telegram.mobileprovision",
              "Share.mobileprovision",
              "NotificationService.mobileprovision",
              "NotificationContent.mobileprovision",
              "Widget.mobileprovision",
              "Intents.mobileprovision",
              "SiriIntents.mobileprovision",
              "BroadcastUpload.mobileprovision",
          ])
          EOF

      - name: Setup Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "app_specific_url_scheme": "legram"
          }
          EOF

      - name: 🚀 Build IPA
        run: |
          # استخدام Python لتشغيل نظام بناء تيليجرام الرسمي
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Archive Production IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-AntiDelete-Final
          path: build/artifacts/*.ipa