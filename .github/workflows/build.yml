name: Build Legram (Final Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Automatic Patch (Anti-Delete)
        run: |
          echo "Searching for deletion logic in all submodules..."
          # البحث عن أي ملف يحتوي على منطق حذف الرسائل وتعديله فوراً
          # نحن نستهدف الدالة التي تتعامل مع deleteMessages في الـ SyncCore
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true
          echo "✅ Patch applied to any matching files found."

      - name: Prepare Signing Identity
        run: |
          # إنشاء المسار الذي يطلبه نظام بناء تيليجرام حصراً
          mkdir -p build-input/data/provisioning
          
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # نسخ الملف لكل الأسماء المتوقعة (بناءً على أخطاء Bazel السابقة)
          cd build-input/data/provisioning
          for name in Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload; do
            cp Telegram.mobileprovision $name.mobileprovision
          done
          cd ../../../

          # إعداد الـ Keychain لتوقيع التطبيق
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Create Definitive BUILD File
        run: |
          # هذا الملف يحل مشكلة 'no such target' نهائياً بجعل كل الملفات أهدافاً عامة
          cat <<EOF > build-input/data/provisioning/BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files(glob(["*.mobileprovision"]))
          EOF

      - name: Configure Telegram Build
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_specific_url_scheme": "legram"
          }
          EOF

      - name: 🚀 Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-AntiDelete-Official
          path: build/artifacts/*.ipa