name: Build Legram (Official Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Bazel
        run: brew install bazelisk

      - name: Prepare Certificates & Provisioning
        run: |
          # 1. إنشاء المجلدات
          mkdir -p build-input/data/provisioning
          
          # 2. فك التشفير
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # 3. نسخ الملفات بأسماء واضحة
          for f in Share NotificationService NotificationContent Widget Intents; do
            cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/$f.mobileprovision
          done

          # 4. تثبيت الشهادة
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 14)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Configure Telegram Build
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

          # استخدام filegroup لتعريف كل ملف كهدف (Target) صريح
          cat <<EOF > build-input/data/provisioning/BUILD
          filegroup(name = "Telegram.mobileprovision", srcs = ["Telegram.mobileprovision"], visibility = ["//visibility:public"])
          filegroup(name = "Share.mobileprovision", srcs = ["Share.mobileprovision"], visibility = ["//visibility:public"])
          filegroup(name = "NotificationService.mobileprovision", srcs = ["NotificationService.mobileprovision"], visibility = ["//visibility:public"])
          filegroup(name = "NotificationContent.mobileprovision", srcs = ["NotificationContent.mobileprovision"], visibility = ["//visibility:public"])
          filegroup(name = "Widget.mobileprovision", srcs = ["Widget.mobileprovision"], visibility = ["//visibility:public"])
          filegroup(name = "Intents.mobileprovision", srcs = ["Intents.mobileprovision"], visibility = ["//visibility:public"])
          EOF
          
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf

      - name: Verify Provisioning Files (Debug)
        run: ls -R build-input/data/provisioning/

      - name: Build Legram IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Official-Package
          path: build/artifacts/*.ipa