name: Legram Ultimate One-Shot Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🧠 Smart Configuration Injection
        run: |
          # 1. إنشاء ملف الإعدادات المستخدم (الطريقة الأذكى في Bazel لعدم كسر الملف الأصلي)
          echo "common --enable_workspace" > .bazelrc.user
          echo "common --noenable_bzlmod" >> .bazelrc.user
          
          # 2. إنشاء هيكلية البيانات الكاملة
          mkdir -p build-input/data/provisioning
          
          # 3. ملف config.json "المثالي" (يحتوي على كل المفاتيح الـ 13 المطلوبة لتجنب KeyError)
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF

          # 4. ملف variables.bzl الذي يطلبه نظام Bazel الداخلي
          cat <<EOF > build-input/data/variables.bzl
          bundle_id = "com.CommitteeSupervision.gov"
          api_id = "${{ secrets.TELEGRAM_API_ID }}"
          api_hash = "${{ secrets.TELEGRAM_API_HASH }}"
          team_id = "9NS9KBTAFV"
          version = "11.5.1"
          build_number = "1"
          enable_siri = false
          enable_icloud = false
          EOF

          # 5. إنشاء ملفات الـ BUILD اللازمة
          echo 'exports_files(["variables.bzl", "config.json"])' > build-input/data/BUILD
          
          # تجهيز ملفات التوقيع (نسخ للمسميات المتعددة التي يطلبها تيليجرام)
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          for name in Telegram Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload ShareExtension NotificationServiceExtension; do
            cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/\$name.mobileprovision
          done
          echo 'package(default_visibility = ["//visibility:public"])' > build-input/data/provisioning/BUILD
          echo 'exports_files(glob(["*.mobileprovision"]))' >> build-input/data/provisioning/BUILD

      - name: 🔗 Atomic Workspace Injection
        run: |
          # حقن المستودع في بداية ملف WORKSPACE لضمان الأولوية
          python3 -c "
          content = open('WORKSPACE').read()
          with open('WORKSPACE', 'w') as f:
              f.write('local_repository(name = \"build_configuration\", path = \"build-input/data\")\n' + content)
          "

      - name: 🔑 Certificate & Keychain
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: 🛠 Apply Core Logic Patch
        run: |
          # تعديل برمجي لمنع حذف الرسائل (ميزة ليجرام الأساسية)
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true

      - name: 🚀 The Final Build
        run: |
          # تشغيل البناء مع تجاوز فحص النسخ وإجبار Bazel على استخدام الإعدادات المحقونة
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Stable-IPA
          path: build/artifacts/*.ipa