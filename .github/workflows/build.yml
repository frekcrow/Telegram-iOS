name: Build Legram (Final Bazel 8 Fixed Standards)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Patch Core (Anti-Delete)
        run: |
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true

      - name: ⚙️ Official Bazel 8 Legacy Support
        run: |
          # الطريقة الرسمية لإجبار Bazel 8 على قراءة WORKSPACE (لحل مشكلة skylib)
          echo "common --enable_workspace" > .bazelrc
          echo "common --noenable_bzlmod" >> .bazelrc
          echo "✅ Bazel 8 configured to respect WORKSPACE."

      - name: 🏗 Prepare build_configuration Repository
        run: |
          # إنشاء الهيكلية المطلوبة برمجياً داخل تيليجرام
          mkdir -p build-input/data/provisioning
          
          # 1. إنشاء ملف variables.bzl (القطعة الناقصة)
          # تيليجرام يحتاج هذه المتغيرات لتمريرها إلى القواعد (Rules)
          cat <<EOF > build-input/data/variables.bzl
          bundle_id = "com.CommitteeSupervision.gov"
          api_id = "${{ secrets.TELEGRAM_API_ID }}"
          api_hash = "${{ secrets.TELEGRAM_API_HASH }}"
          team_id = "9NS9KBTAFV"
          version = "11.5.1"
          build_number = "1"
          EOF

          # 2. إنشاء ملف BUILD الأساسي في data
          echo 'exports_files(["variables.bzl", "config.json"])' > build-input/data/BUILD

          # 3. تجهيز التوقيع داخل مجلد provisioning
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          cd build-input/data/provisioning
          # نسخ الملف لكل الأسماء التي قد يطلبها ملف Telegram/BUILD
          for name in Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload ShareExtension NotificationServiceExtension; do
            cp Telegram.mobileprovision \$name.mobileprovision
          done
          
          echo 'package(default_visibility = ["//visibility:public"])' > BUILD
          echo 'exports_files(glob(["*.mobileprovision"]))' >> BUILD
          cd ../../../

      - name: 🔗 Register Repository in WORKSPACE
        run: |
          # الطريقة الرسمية لربط المستودع المحلي في نظام WORKSPACE
          # سنضيفه في أول السطر لضمان عدم تجاوزه
          sed -i '' '1i\
          local_repository(name = "build_configuration", path = "build-input/data")\
          ' WORKSPACE

      - name: 🔑 Install Signing Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: ⚙️ Setup Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "app_specific_url_scheme": "legram"
          }
          EOF

      - name: 🚀 Start Official Build
        run: |
          # سكريبت تيليجرام سيقوم الآن باستدعاء Bazel 8
          # وبما أننا فعلنا --enable_workspace، سيجد كل التبعيات
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Final-Stable
          path: build/artifacts/*.ipa