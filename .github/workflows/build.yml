name: Build Legram (Structure Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Bazel
        run: brew install bazelisk

      - name: Prepare Configuration Structure
        run: |
          # 1. إنشاء الهيكل الذي يتوقعه نظام تيليجرام
          mkdir -p config/provisioning
          
          # 2. إنشاء ملف الإعدادات داخل مجلد config
          cat <<EOF > config/config.json
          {
            "bundle_id": "com.legram.ios",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "1234567890",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

          # 3. إنشاء الشهادات الوهمية داخل المجلد الصحيح
          for f in Telegram Share NotificationService NotificationContent Widget Intents; do
            touch config/provisioning/$f.mobileprovision
          done

          # 4. كتابة ملف التعريف لـ Bazel ليعرف أن هذه الملفات موجودة
          echo 'exports_files(glob(["*.mobileprovision"]))' > config/provisioning/BUILD
          
          # 5. ملف المتغيرات الأساسي
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf

      - name: Build Legram IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 100 \
            --configurationPath config/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Package
          path: build/artifacts/*.ipa