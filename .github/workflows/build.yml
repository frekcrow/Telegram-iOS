name: Build Legram (Official Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk openssl

      - name: 🛠 Inject Anti-Delete Feature (Dynamic Patch)
        run: |
          echo "Searching for the core synchronization file..."
          # البحث عن الملف في كل المستودعات الفرعية وتخزينه في متغير
          TARGET_FILE=$(find submodules/TelegramCore -name "ManagedSynchronizeGroupMessagesOperations.swift")
          
          if [ -n "$TARGET_FILE" ]; then
            echo "Found file at: $TARGET_FILE"
            # تطبيق التعديل: منع حذف الرسائل
            sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' "$TARGET_FILE"
            echo "✅ Anti-Delete feature injected successfully!"
          else
            echo "❌ Could not find ManagedSynchronizeGroupMessagesOperations.swift automatically."
            exit 1
          fi

      - name: Prepare Signing Identity
        run: |
          mkdir -p build-input/data/provisioning
          
          # فك تشفير البيانات
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # الأهداف الرسمية التي تطلبها أحدث نسخة من تيليجرام
          EXTENSIONS=("Share" "NotificationService" "NotificationContent" "Widget" "Intents" "SiriIntents" "BroadcastUpload" "NotificationServiceExtension" "ShareExtension")
          for ext in "${EXTENSIONS[@]}"; do
            cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/$ext.mobileprovision
          done

          # إعداد الـ Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Create Definitive BUILD File
        run: |
          # تعريف الأهداف بشكل صريح جداً لـ Bazel
          cat <<EOF > build-input/data/provisioning/BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files(glob(["*.mobileprovision"]))
          EOF

      - name: Setup Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "app_specific_url_scheme": "legram"
          }
          EOF

      - name: 🚀 Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Archive Production IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-AntiDelete-Final
          path: build/artifacts/*.ipa