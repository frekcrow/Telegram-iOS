name: Build Legram (Final Override)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Bazel
        run: brew install bazelisk

      - name: Prepare Configuration
        run: |
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf
          echo "bundle_id = com.legram.ios" >> build_variables.conf
          echo "{}" > app_config.json

      - name: Build Legram IPA
        run: |
          # أضفنا أوامر التجاوز هنا قبل كلمة build
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 100 \
            --configurationPath . \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Package
          path: build/artifacts/*.ipa