name: Build Legram (Provisioning Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Bazel
        run: brew install bazelisk

      - name: Prepare Configuration
        run: |
          # 1. إنشاء ملفات الإعداد الأساسية
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf
          
          cat <<EOF > app_config.json
          {
            "bundle_id": "com.legram.ios",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "1234567890",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

          # 2. خدعة الشهادات: إنشاء مجلد وهمي للشهادات لإرضاء Bazel
          mkdir -p provisioning
          touch provisioning/Telegram.mobileprovision
          touch provisioning/Share.mobileprovision
          touch provisioning/NotificationService.mobileprovision
          touch provisioning/NotificationContent.mobileprovision
          touch provisioning/Widget.mobileprovision
          touch provisioning/Intents.mobileprovision
          
          # إنشاء ملف BUILD للمجلد لكي يراه Bazel
          echo 'exports_files(glob(["*.mobileprovision"]))' > provisioning/BUILD

      - name: Build Legram IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 100 \
            --configurationPath app_config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Package
          path: build/artifacts/*.ipa