name: Build Legram (Official Bazel 8 Standards)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Patch Core (Anti-Delete)
        run: |
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true

      - name: 📦 Create Official Bazel Module
        run: |
          # 1. إنشاء مجلد الإعدادات
          mkdir -p build-input/data/provisioning
          
          # 2. فك التوقيع ونسخه للأسماء المطلوبة
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          cd build-input/data/provisioning
          for name in Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload ShareExtension NotificationServiceExtension; do
            cp Telegram.mobileprovision $name.mobileprovision
          done
          
          # 3. إنشاء ملف BUILD الرسمي داخل المجلد
          cat <<EOF > BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files(glob(["*.mobileprovision"]))
          EOF
          
          # 4. جعل المجلد "Module" رسمياً (هذا ما يطلبه Bazel 8)
          cd ..
          touch variables.bzl
          cat <<EOF > MODULE.bazel
          module(name = "build_configuration", version = "1.0")
          EOF
          cd ../../

      - name: 📝 Register Module Officially
        run: |
          # إضافة الموديل الجديد لملف MODULE.bazel الرئيسي في المشروع
          # إذا لم يكن موجوداً، سننشئه ونربط المجلد محلياً
          cat <<EOF > MODULE.bazel
          bazel_dep(name = "build_configuration")
          local_path_override(
              module_name = "build_configuration",
              path = "build-input/data",
          )
          EOF

      - name: 🔑 Install Signing Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: ⚙️ Setup Official Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: 🚀 Build IPA (Official Way)
        run: |
          # الآن سيعمل Bazel بالنظام الجديد الذي يفضله
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Archive
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Official-Build
          path: build/artifacts/*.ipa