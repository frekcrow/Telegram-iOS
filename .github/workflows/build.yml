name: Build Legram (Official Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Bazel
        run: brew install bazelisk

      - name: Prepare Certificates & Provisioning
        run: |
          # 1. إنشاء المجلدات المطلوبة
          mkdir -p build-input/data/provisioning
          
          # 2. فك تشفير الشهادة وملف التوقيع
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # 3. نسخ الملف لجميع الأقسام بأسماء صريحة
          cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/Share.mobileprovision
          cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/NotificationService.mobileprovision
          cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/NotificationContent.mobileprovision
          cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/Widget.mobileprovision
          cp build-input/data/provisioning/Telegram.mobileprovision build-input/data/provisioning/Intents.mobileprovision

          # 4. تثبيت الشهادة في Keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 14)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Configure Telegram Build
        run: |
          # إنشاء ملف الإعدادات
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

          # ملف BUILD بتعريفات صريحة (هذا هو مفتاح حل الخطأ الحالي)
          cat <<EOF > build-input/data/provisioning/BUILD
          exports_files([
              "Telegram.mobileprovision",
              "Share.mobileprovision",
              "NotificationService.mobileprovision",
              "NotificationContent.mobileprovision",
              "Widget.mobileprovision",
              "Intents.mobileprovision",
          ])
          EOF
          
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf

      - name: Build Legram IPA
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Official-Package
          path: build/artifacts/*.ipa