name: Legram Final Masterstroke (Forced 6.4.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 🛑 Total Bazel Purge & Force 6.4.0
        run: |
          # 1. قتل أي خادم Bazel يعمل في الخلفية (لمنع ظهور 8.4.2)
          bazel shutdown || true
          sudo rm -rf /usr/local/bin/bazel || true
          
          # 2. تنزيل نسخة 6.4.0 ووضعها كنسخة "نظام" أساسية
          curl -L https://github.com/bazelbuild/bazel/releases/download/6.4.0/bazel-6.4.0-darwin-arm64 -o ./bazel
          chmod +x ./bazel
          sudo mv ./bazel /usr/local/bin/bazel
          
          # التأكد من أن النظام يرى 6.4.0 فقط
          bazel --version

      - name: 🛠 "Daring" Patch (Remove Modern Flags)
        run: |
          # هنا "الدهاء": سنبحث في كل ملفات المشروع عن الخيار الذي سبب الفشل ونحذفه
          # هذا الخيار لا يفهمه Bazel 6 ولكنه موجود في سكريبتات تيليجرام
          grep -rl "remote_cache_async" . | xargs sed -i '' 's/--remote_cache_async//g' || true
          echo "✅ Incompatible flags stripped from build system."

      - name: 🏗 Prepare Configuration
        run: |
          mkdir -p build-input/data/provisioning
          
          # ملف config.json الكامل (لمنع KeyError)
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF

          # ملف variables.bzl
          cat <<EOF > build-input/data/variables.bzl
          bundle_id = "com.CommitteeSupervision.gov"
          api_id = "${{ secrets.TELEGRAM_API_ID }}"
          api_hash = "${{ secrets.TELEGRAM_API_HASH }}"
          team_id = "9NS9KBTAFV"
          version = "11.5.1"
          build_number = "1"
          enable_siri = false
          enable_icloud = false
          EOF

          echo 'exports_files(["variables.bzl", "config.json"])' > build-input/data/BUILD

      - name: 🔐 Provisioning
        run: |
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          cd build-input/data/provisioning
          for name in Telegram Share NotificationService NotificationContent Widget Intents SiriIntents BroadcastUpload ShareExtension NotificationServiceExtension; do
            cp Telegram.mobileprovision \$name.mobileprovision
          done
          echo 'package(default_visibility = ["//visibility:public"])' > BUILD
          echo 'exports_files(glob(["*.mobileprovision"]))' >> BUILD

      - name: 🔗 Inject WORKSPACE
        run: |
          sed -i '' '1i\
          local_repository(name = "build_configuration", path = "build-input/data")\
          ' WORKSPACE

      - name: 🔑 Identity
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: 🛠 Core Logic Patch
        run: |
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true

      - name: 🚀 The Final Execution
        run: |
          # الآن سيعمل السكريبت وهو يظن أنه يستخدم Bazel حديث، لكنه في الحقيقة يستخدم 6.4.0
          # وبدون الخيارات التي تسبب المشاكل
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Final-Success
          path: build/artifacts/*.ipa