name: Build Legram (Final Version)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Bazel
        run: brew install bazelisk

      - name: Prepare API Keys
        run: |
          mkdir -p build-input/data
          echo "api_id = ${{ secrets.TELEGRAM_API_ID }}" > build_variables.conf
          echo "api_hash = ${{ secrets.TELEGRAM_API_HASH }}" >> build_variables.conf

      - name: Build Legram IPA
        run: |
          python3 build-system/Make/Make.py build \
            --bundle_id "com.legram.ios" \
            --display_name "Legram" \
            --api_id "${{ secrets.TELEGRAM_API_ID }}" \
            --api_hash "${{ secrets.TELEGRAM_API_HASH }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-Package
          path: build/artifacts/*.ipa