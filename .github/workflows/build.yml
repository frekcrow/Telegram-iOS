name: Build Legram (Final Explicit Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Tools
        run: brew install bazelisk

      - name: 🛠 Patch Core (Anti-Delete)
        run: |
          echo "Injecting Anti-Delete logic..."
          # تعديل كود حذف الرسائل لجعله لا يفعل شيئاً
          grep -rl "case let .deleteMessages(ids):" submodules/ | xargs sed -i '' 's/case let .deleteMessages(ids):/case .deleteMessages(_): return .complete/g' || true
          echo "✅ Anti-Delete patch applied."

      - name: 🔐 Prepare Provisioning (Explicit Targets)
        run: |
          # 1. إنشاء المجلدات
          mkdir -p build-input/data/provisioning
          
          # 2. فك ملف التوقيع الأساسي
          echo "${{ secrets.PROVISIONING_BASE64 }}" | base64 --decode > build-input/data/provisioning/Telegram.mobileprovision
          
          # 3. نسخ الملف لكل الملحقات المحتملة (بناءً على أخطاء السجلات)
          PROV_DIR="build-input/data/provisioning"
          NAMES=("Share" "NotificationService" "NotificationContent" "Widget" "Intents" "SiriIntents" "BroadcastUpload" "ShareExtension" "NotificationServiceExtension")
          
          for name in "${NAMES[@]}"; do
            cp "$PROV_DIR/Telegram.mobileprovision" "$PROV_DIR/$name.mobileprovision"
          done

          # 4. إنشاء ملف BUILD صريح 100% (بدون استخدام glob)
          cat <<EOF > $PROV_DIR/BUILD
          package(default_visibility = ["//visibility:public"])
          exports_files([
              "Telegram.mobileprovision",
              "Share.mobileprovision",
              "NotificationService.mobileprovision",
              "NotificationContent.mobileprovision",
              "Widget.mobileprovision",
              "Intents.mobileprovision",
              "SiriIntents.mobileprovision",
              "BroadcastUpload.mobileprovision",
              "ShareExtension.mobileprovision",
              "NotificationServiceExtension.mobileprovision",
          ])
          EOF

      - name: 🏗 Inject Build Configuration Repository
        run: |
          # تعريف المستودع في ملف WORKSPACE ليتعرف عليه Bazel 8
          touch build-input/data/BUILD
          touch build-input/data/variables.bzl
          
          # إضافة التعريف في بداية الملف لضمان الأولوية
          sed -i '' '1i\
          local_repository(name = "build_configuration", path = "build-input/data")\
          ' WORKSPACE
          
          echo "✅ Repository build_configuration injected."

      - name: 🔍 Debug File Structure
        run: |
          echo "Checking provisioning targets..."
          cat build-input/data/provisioning/BUILD
          ls build-input/data/provisioning/

      - name: 🔑 Install Signing Certificate
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -A
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: ⚙️ Setup Config JSON
        run: |
          cat <<EOF > build-input/data/config.json
          {
            "bundle_id": "com.CommitteeSupervision.gov",
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "9NS9KBTAFV",
            "app_center_id": "0",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "legram",
            "premium_iap_product_id": "com.legram.premium",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: 🚀 Build IPA
        run: |
          # حذف أي إعدادات سابقة قد تسبب تضارباً
          rm -f .bazelrc
          
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --buildNumber 1 \
            --configurationPath build-input/data/config.json \
            --configuration release_arm64 \
            --xcodeManagedCodesigning

      - name: 📦 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legram-IPA-Package
          path: build/artifacts/*.ipa